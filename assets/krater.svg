<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="senke" cx="50%" cy="52%" r="70%">
      <stop offset="0" stop-color="#5e3a2c"/>
      <stop offset="0.55" stop-color="#7a4430"/>
      <stop offset="0.85" stop-color="#a5583a"/>
      <stop offset="1" stop-color="#c9774f"/>
    </radialGradient>
    <radialGradient id="glanz" cx="50%" cy="50%" r="50%">
