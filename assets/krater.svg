  </defs>
  <rect width="400" height="400" fill="url(#senke)"/>
  <!-- Kraterrand: hellerer Ring an den Rändern -->
  <rect x="6" y="6" width="388" height="388" rx="160" fill="none" stroke="#d99068" stroke-width="10" opacity="0.35"/>
  <!-- Schatten der steilen Wand oben -->
  <path d="M0,0 H400 V60 C300,30 100,30 0,60 Z" fill="#3e2219" opacity="0.35"/>
  <!-- Geröll -->
  <g fill="#4a2a1e" opacity="0.7">
    <ellipse cx="70" cy="320" rx="7" ry="4"/>
    <ellipse cx="330" cy="300" rx="9" ry="5"/>
    <ellipse cx="250" cy="90" rx="5" ry="3"/>
    <ellipse cx="120" cy="140" rx="6" ry="4"/>
    <ellipse cx="300" cy="200" rx="4" ry="3"/>
    <ellipse cx="160" cy="360" rx="6" ry="3"/>
  </g>
  <!-- Eiskristalle mit Glanz -->
  <g>
    <circle cx="90" cy="90" r="16" fill="url(#glanz)"/>
    <path d="M90,80 L94,90 L90,100 L86,90 Z" fill="#dff7fb"/>
    <circle cx="320" cy="120" r="14" fill="url(#glanz)"/>
    <path d="M320,111 L323,120 L320,129 L317,120 Z" fill="#dff7fb"/>
    <circle cx="300" cy="350" r="18" fill="url(#glanz)"/>
