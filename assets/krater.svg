    <circle cx="210" cy="300" r="10" fill="url(#glanz)"/>
    <path d="M210,293 L212,300 L210,307 L208,300 Z" fill="#dff7fb"/>
  </g>
  <!-- feiner Staub -->
  <g fill="#e2a27e" opacity="0.4">
    <circle cx="150" cy="60" r="1.5"/><circle cx="260" cy="250" r="1.5"/><circle cx="350" cy="60" r="1.5"/>
    <circle cx="40" cy="380" r="1.5"/><circle cx="190" cy="200" r="1.2"/><circle cx="370" cy="240" r="1.2"/>
